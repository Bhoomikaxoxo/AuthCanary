# ─────────────────────────────────────────────────────────────────
# AuthCanary Configuration
# Real-time macOS System Log Activity Monitor & Invariant Triage
# ─────────────────────────────────────────────────────────────────

log_source:
  # "auto" = detect OS adapter automatically
  # Or set an explicit path: "/var/log/auth.log", "journald", etc.
  path: "auto"

monitor:
  # Processes actively monitored in the Activity Monitor view
  processes:
    - sudo
    - authd
    - sshd
    - opendirectoryd
    - tcc
  live_stream: true
  stream_poll_sec: 2

invariants:
  alert_severities:
    - CRITICAL
    - WARNING
  always_alert:
    - UNAUTHORIZED_KEY_ADD
    - KILL_CHAIN_ESCALATION
    - CONFIG_DRIFT

correlation:
  sequence_window_min: 15     # Lookback window for multi-stage sequence correlation

integrity:
  enabled: true
  targets:
    - "/etc/ssh/sshd_config"
    - "~/.ssh/authorized_keys"
    - "/etc/sudoers"
    - "/etc/sudoers.d"

enrichment:
  enabled: true
  provider: "ip-api"
  cache_ttl_days: 30
  rate_limit_per_min: 45

alerts:
  console: true
  ntfy:
    enabled: false
    topic: "authcanary-alerts"
    server: "https://ntfy.sh"

output:
  directory: "./output"

storage:
  db_path: "~/.authcanary/authcanary.db"
  cursor_path: "~/.authcanary/cursor.json"
